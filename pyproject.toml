[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-hello"
version = "0.1.0"
description = "A modular, SOLID-by-design FastAPI hello-world service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["fastapi", "clean-architecture", "solid", "template"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
fastapi-hello = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/decagondev/fastapi-hello"
Issues = "https://github.com/decagondev/fastapi-hello/issues"
Changelog = "https://github.com/decagondev/fastapi-hello/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black, isort, flake8, pyupgrade, bandit)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "ARG",  # unused arguments
  "ASYNC",# flake8-async
  "B",    # flake8-bugbear
  "C4",   # comprehensions
  "C90",  # mccabe complexity
  "D",    # pydocstyle
  "DTZ",  # naive datetimes
  "E",    # pycodestyle errors
  "EM",   # error messages
  "ERA",  # commented-out code
  "F",    # pyflakes
  "FBT",  # boolean traps
  "I",    # isort
  "ICN",  # import conventions
  "ISC",  # implicit string concat
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",
  "PL",   # pylint
  "PT",   # pytest style
  "PTH",  # use pathlib
  "RET",  # return statements
  "RSE",
  "RUF",  # ruff-specific
  "S",    # bandit security
  "SIM",  # simplify
  "SLF",  # private member access
  "T20",  # no print
  "TC",   # type-checking imports
  "TID",  # tidy imports
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
ignore = [
  "D100",   # module docstring covered by our own review
  "D104",   # package docstring optional
  "D107",   # __init__ docstring
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ISC001", # conflicts with the formatter
  "TRY003", # long messages in exceptions are fine for a small domain
  # FastAPI and Pydantic resolve annotations at runtime, so imports used only
  # in signatures must stay outside `if TYPE_CHECKING:` blocks.
  "TC001",
  "TC002",
  "TC003",
]

# Japanese punctuation is intentional in the greeting templates.
allowed-confusables = ["！", "、"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "EM", "PLR2004", "S101", "SLF001", "TRY"]
"src/app/__main__.py" = ["D"]
# A CLI script: printing is the entire point.
"scripts/*.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy: strict static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/app", "tests", "scripts"]
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=90",
]
markers = [
  "unit: fast, isolated tests with no I/O",
  "integration: tests exercising the wired application",
]
filterwarnings = ["error", "ignore::DeprecationWarning:httpx.*"]

[tool.coverage.run]
branch = true
source = ["src/app"]
omit = ["src/app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
